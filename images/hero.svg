<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="codeBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
  </defs>

  <rect width="720" height="430" fill="url(#heroBg)"/>

  <!-- 背景装饰圆 -->
  <circle cx="636" cy="62" r="86" fill="#bfdbfe" opacity="0.55"/>
  <circle cx="92" cy="372" r="64" fill="#fde68a" opacity="0.5"/>
  <circle cx="672" cy="352" r="34" fill="#93c5fd" opacity="0.6"/>

  <!-- 浏览器窗口 -->
  <g>
    <rect x="86" y="72" width="500" height="300" rx="14" fill="#ffffff"
          stroke="#cbd5e1" stroke-width="2"/>
    <!-- 标题栏 -->
    <path d="M86 86 a14 14 0 0 1 14-14 h472 a14 14 0 0 1 14 14 v26 h-500 z" fill="url(#codeBar)"/>
    <circle cx="108" cy="92" r="6" fill="#f87171"/>
    <circle cx="128" cy="92" r="6" fill="#fbbf24"/>
    <circle cx="148" cy="92" r="6" fill="#34d399"/>
    <rect x="176" y="84" width="220" height="16" rx="8" fill="#ffffff" opacity="0.28"/>
    <text x="182" y="97" font-family="Consolas, monospace" font-size="11"
          fill="#e0e7ff">localhost:8080/index.html</text>

    <!-- 代码行 -->
    <g font-family="Consolas, monospace" font-size="14">
      <text x="116" y="152" fill="#7c3aed">&lt;%@ page</text>
      <text x="212" y="152" fill="#0f172a">language=</text>
      <text x="292" y="152" fill="#059669">"java"</text>
      <text x="342" y="152" fill="#0f172a">%&gt;</text>

      <text x="116" y="182" fill="#2563eb">&lt;div</text>
      <text x="156" y="182" fill="#b45309">class</text>
      <text x="196" y="182" fill="#0f172a">=</text>
      <text x="206" y="182" fill="#059669">"container"</text>
      <text x="300" y="182" fill="#2563eb">&gt;</text>

      <text x="136" y="212" fill="#2563eb">&lt;h1&gt;</text>
      <text x="186" y="212" fill="#0f172a">Hello, Java Web!</text>
      <text x="326" y="212" fill="#2563eb">&lt;/h1&gt;</text>

      <text x="136" y="242" fill="#2563eb">&lt;img</text>
      <text x="176" y="242" fill="#b45309">src</text>
      <text x="206" y="242" fill="#0f172a">=</text>
      <text x="216" y="242" fill="#059669">"hero.svg"</text>
      <text x="300" y="242" fill="#2563eb">/&gt;</text>

      <text x="116" y="272" fill="#2563eb">&lt;/div&gt;</text>

      <text x="116" y="312" fill="#94a3b8">// 编译通过 ✓</text>
      <rect x="116" y="326" width="14" height="18" fill="#3b82f6"/>
      <rect x="138" y="326" width="62" height="18" rx="3" fill="#dbeafe"/>
    </g>
  </g>

  <!-- 浮动标签 -->
  <g>
    <rect x="536" y="118" width="132" height="46" rx="12" fill="#ffffff"
          stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="564" cy="141" r="13" fill="#fef3c7"/>
    <text x="564" y="146" font-family="Microsoft YaHei, sans-serif" font-size="13"
          fill="#b45309" text-anchor="middle" font-weight="bold">J</text>
    <text x="586" y="146" font-family="Microsoft YaHei, sans-serif" font-size="14"
          fill="#1e293b" font-weight="bold">Java 基础</text>
  </g>
  <g>
    <rect x="560" y="196" width="132" height="46" rx="12" fill="#ffffff"
          stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="588" cy="219" r="13" fill="#dbeafe"/>
    <text x="588" y="224" font-family="Microsoft YaHei, sans-serif" font-size="12"
          fill="#1d4ed8" text-anchor="middle" font-weight="bold">&lt;/&gt;</text>
    <text x="610" y="224" font-family="Microsoft YaHei, sans-serif" font-size="14"
          fill="#1e293b" font-weight="bold">Web 前端</text>
  </g>
  <g>
    <rect x="516" y="274" width="132" height="46" rx="12" fill="#ffffff"
          stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="544" cy="297" r="13" fill="#dcfce7"/>
    <text x="544" y="302" font-family="Microsoft YaHei, sans-serif" font-size="12"
          fill="#15803d" text-anchor="middle" font-weight="bold">DB</text>
    <text x="566" y="302" font-family="Microsoft YaHei, sans-serif" font-size="14"
          fill="#1e293b" font-weight="bold">数据库</text>
  </g>
</svg>
